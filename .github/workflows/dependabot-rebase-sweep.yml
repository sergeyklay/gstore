name: Dependabot rebase sweep

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

concurrency:
  group: dependabot-rebase-sweep
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  sweep:
    uses: sortie-ai/shared-workflows/.github/workflows/dependabot-rebase-sweep.yml@6d471deb70b0fee52d42366fb84f76b95d8f957a # v1.2.0
    secrets:
      bot-token: ${{ secrets.CICDBOT_TOKEN }}
