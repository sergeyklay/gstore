name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    if: ${{ github.actor == 'dependabot[bot]' || github.actor == 'dependabot-preview[bot]' }}
    uses: sortie-ai/shared-workflows/.github/workflows/dependabot-merge.yml@6d471deb70b0fee52d42366fb84f76b95d8f957a # v1.2.0
    secrets:
      bot-token: ${{ secrets.CICDBOT_TOKEN }}
